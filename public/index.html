  <script>
  function getParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
  }

  const utmFields = ["utm_source", "utm_medium", "utm_campaign", "utm_term"];

  utmFields.forEach(p => {
    const value = getParam(p);
    if (value) {
      localStorage.setItem(p, value);   
    } else {
      localStorage.removeItem(p);       
    }
  });

  localStorage.setItem("page_title", document.title);
  localStorage.setItem("page_url", window.location.href);
</script>
